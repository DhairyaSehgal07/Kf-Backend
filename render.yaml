# Render Blueprint: ensures the TypeScript build runs before start
# so dist/server.js exists (dist/ is gitignored and not in the repo).
services:
  - type: web
    name: bhatti-backend
    runtime: node
    # Must run build so tsc produces dist/server.js (Render default only runs install).
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm start
